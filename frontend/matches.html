<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Matches - SkillSwap</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navbar with Logo -->
    <nav class="navbar">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; max-width: 1200px; margin: 0 auto;">
            <div class="logo">
                <img src="assets/logo.png" alt="SkillSwap" style="height: 40px;">
            </div>
            <div class="nav-links" style="display: flex; gap: 2rem;">
                <a href="swipe.html" style="color: white; text-decoration: none;">Discover</a>
                <a href="matches.html" style="color: white; text-decoration: none;">Matches</a>
                <a href="profile.html" style="color: white; text-decoration: none;">Profile</a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-container">
        <h2>Your Matches <small style="color: #6c757d;">(3 matches)</small></h2>

        <input type="text" class="form-input" placeholder="Search matches..." id="search-matches">

        <div style="border-top: 1px solid #e5e7eb; margin: 1rem 0;"></div>

        <div class="match-item" data-name="Sarah Miller" style="display: flex; gap: 1rem; padding: 1rem; border-radius: 12px; background: white; margin-bottom: 0.75rem; cursor: pointer;">
            <div style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">SM</div>
            <div style="flex: 1;">
                <div style="font-weight: bold;">Sarah Miller</div>
                <div style="font-size: 0.85rem; color: #6c757d;">"That sounds great! When are you free?"</div>
            </div>
            <div style="font-size: 0.75rem; color: #6c757d;">2h ago</div>
        </div>

        <div class="match-item" data-name="Michael Chen" style="display: flex; gap: 1rem; padding: 1rem; border-radius: 12px; background: white; margin-bottom: 0.75rem; cursor: pointer;">
            <div style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">MC</div>
            <div style="flex: 1;">
                <div style="font-weight: bold;">Michael Chen</div>
                <div style="font-size: 0.85rem; color: #6c757d;">"Ready for our guitar lesson tomorrow?"</div>
            </div>
            <div style="font-size: 0.75rem; color: #6c757d;">1d ago</div>
        </div>

        <div class="match-item" data-name="Emma Rodriguez" style="display: flex; gap: 1rem; padding: 1rem; border-radius: 12px; background: white; margin-bottom: 0.75rem; cursor: pointer;">
            <div style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">ER</div>
            <div style="flex: 1;">
                <div style="font-weight: bold;">Emma Rodriguez</div>
                <div style="font-size: 0.85rem; color: #6c757d;">"Thanks for the Python help!"</div>
            </div>
            <div style="font-size: 0.75rem; color: #6c757d;">3d ago</div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/matches.js"></script>
</body>
</html>
