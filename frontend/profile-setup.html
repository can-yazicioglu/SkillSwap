<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup - SkillSwap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <img src="assets/logo.png" alt="SkillSwap">
      SkillSwap
    </a>
    <button class="hamburger" aria-label="Toggle menu">&#9776;</button>
    <div class="navbar-links">
      <a href="swipe.html">Swipe</a>
      <a href="matches.html">Matches</a>
      <a href="profile.html">Profile</a>
      <a href="#" id="logout-btn">Logout</a>
    </div>
  </nav>

  <div class="page-container">
    <!-- Profile setup content goes here -->
    <h2>Set Up Your Profile</h2>
    <p>Tell people who you are and what you can teach.</p>

    <div class="card">
      <form>
        <div class="form-group">
          <label for="display-name">Display Name</label>
          <input type="text" id="display-name" class="form-input" placeholder="Your full name">
          <span class="form-error" id="display-name-error"></span>   
  </div>

          <div class="form-group">
          <label for="bio">Bio</label>
          <textarea id="bio" class="form-input" placeholder="Tell people a bit about yourself..."></textarea>
          <span class="form-error" id="bio-error"></span>
        </div>

        <div>
          <label>Skills I Can Teach</label>
          <input type="text" id="teach-skill-input" class="form-input" placeholder="e.g., Guitar">
          <button type="button" id="add-teach-btn">Add</button>
          <div id="teach-skills-container" class="skill-tags-container"></div>
        </div>

        <div>
          <label>Skills I Want to Learn</label>
          <input type="text" id="learn-skill-input" class="form-input" placeholder="e.g., Photography">
          <button type="button" id="add-learn-btn">Add</button>
          <div id="learn-skills-container" class="skill-tags-container"></div>
        </div>

        <button type="submit" class="btn-primary full-width">Save and Start Swiping</button>
      </form>
    </div>

  </div>

  <script src="js/app.js"></script>
  <script src = "js/profile.js"></script>
</body>
</html>
