<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillSwap</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="page-container flex-center" style="min-height: 100vh;">
    <div class="card flex-column gap-md" style="width: 100%;">
      <div class="text-center">
        <img src="/static/logo.png" alt="SkillSwap" style="width: 64px; margin: 0 auto 12px;">
        <h2>Welcome Back</h2>
        <p class="text-muted">Log in to continue swapping skills</p>
      </div>

      <hr style="border: none; border-top: 1px solid var(--bg-input);">

      <form id="login-form" class="flex-column gap-md">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="Enter your email">
          <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password">
          <span class="form-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <p class="text-center text-muted" style="font-size: 0.9rem;">
        Don't have an account? <a href="/signup" style="color: var(--primary-purple); font-weight: 600;">Sign Up</a>
      </p>
    </div>
  </div>

  <script type="module" src="/static/app.js"></script>
  <script type="module" src="/static/login.js"></script>
</body>
</html>
