<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swipe - SkillSwap</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <img src="/static/logo.png" alt="SkillSwap">
      SkillSwap
    </a>
    <button class="hamburger" aria-label="Toggle menu">&#9776;</button>
    <div class="navbar-links">
      <a href="/swipe">Swipe</a>
      <a href="/matches">Matches</a>
      <a href="/profile">Profile</a>
      <a href="#" id="logout-btn">Logout</a>
    </div>
  </nav>

  <div class="page-container">
    <h1 style="text-align: center;">Discover</h1>

    <div class="swipe-card" id="swipe-card">
      <div class="avatar avatar-xl" id="profile-avatar"></div>
      <h2 id="profile-name">Loading...</h2>
      <p id="profile-bio"></p>

      <div class="skills-section">
        <h3>Can Teach</h3>
        <div class="skill-tags-container" id="teach-skills">
          <span class="skill-tag skill-tag-teach">...</span>
          <span class="skill-tag skill-tag-teach">...</span>
        </div>
      </div>

      <div class="skills-section">
        <h3>Wants to Learn</h3>
        <div class="skill-tags-container" id="learn-skills">
          <span class="skill-tag skill-tag-learn">...</span>
          <span class="skill-tag skill-tag-learn">...</span>
        </div>
      </div>
    </div>

    <div class="swipe-actions">
      <button id="btn-pass" class="swipe-btn-pass">❌</button>
      <button id="btn-like" class="swipe-btn-match">✅</button>
    </div>

    <p style="text-align: center;">← Pass Like →</p>
  </div>

  <div class="match-popup-overlay" id="match-overlay">
    <div class="match-popup">
      <div style="font-size: 3rem;">🎉</div>
      <h2>It's a Match!</h2>
      <p id="match-desc" style="margin-bottom: 12px;"></p>
      <a href="/chat" class="btn btn-primary">Send a Message</a>
      <button class="btn btn-outline" id="btn-keep-swiping">Keep Swiping</button>
    </div>
  </div>

  <script type="module" src="/static/app.js"></script>
  <script type="module" src="/static/swipe.js"></script>
</body>
</html>
