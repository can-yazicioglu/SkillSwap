<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - SkillSwap</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navbar with Logo -->
    <nav class="navbar">
    <a href="/" class="navbar-brand">
        <img src="/static/logo.png" alt="SkillSwap">
        SkillSwap
    </a>
    <button class="hamburger">&#9776;</button>
    <div class="navbar-links">
        <a href="/swipe">Swipe</a>
        <a href="/matches">Matches</a>
        <a href="/profile">Profile</a>
        <a href="#" id="logout-btn">Logout</a>
    </div>
</nav>

    <!-- Chat Layout -->
    <div style="display: flex; flex-direction: column; height: calc(100vh - 70px);">
        <!-- Chat Header -->
        <div style="background: white; padding: 1rem; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 1rem;">
            <a href="/matches" style="color: #1f2937; text-decoration: none; font-size: 1.5rem;">←</a>
            <div id="chat-avatar" style="width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white;"></div>
            <div>
                <div id="chat-username" style="font-weight: bold;">Loading...</div>
            </div>
        </div>

        <!-- Message List -->
        <div id="message-list" style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem;"></div>

        <!-- Chat Input -->
        <div style="background: white; padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem;">
            <input type="text" id="message-input" class="form-input" placeholder="Type a message..." style="flex: 1;">
            <button id="send-btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: bold;">Send</button>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
    <script type="module" src="/static/chat.js"></script>
</body>
</html>
