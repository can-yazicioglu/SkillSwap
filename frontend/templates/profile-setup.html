<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup - SkillSwap</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <img src="/static/logo.png" alt="SkillSwap">
      SkillSwap
    </a>
    <button class="hamburger" aria-label="Toggle menu">&#9776;</button>
    <div class="navbar-links">
      <a href="/swipe">Swipe</a>
      <a href="/matches">Matches</a>
      <a href="/profile">Profile</a>
      <a href="#" id="logout-btn">Logout</a>
    </div>
  </nav>

  <div class="page-container">

    <h2>Set Up Your Profile</h2>
    <p>Tell people who you are and what you can teach.</p>

    <div class="card">

      <form>

        <div class="form-group">
          <label for="bio">Bio</label>
          <textarea id="bio" class="form-input" placeholder="Tell people a bit about yourself..."></textarea>
          <span class="form-error" id="bio-error"></span>
        </div>

        <div>
          <label>Skills I Can Teach</label>
          <input type="text" id="teach-skill-input" class="form-input" placeholder="e.g., Guitar">
          <button type="button" id="add-teach-btn" class="btn btn-secondary btn-sm">Add</button>
          <div id="teach-skills-container" class="skill-tags-container"></div>
        </div>

        <div>
          <label>Skills I Want to Learn</label>
          <input type="text" id="learn-skill-input" class="form-input" placeholder="e.g., Photography">
          <button type="button" id="add-learn-btn" class="btn btn-secondary btn-sm">Add</button>
          <div id="learn-skills-container" class="skill-tags-container"></div>
        </div>

        <button type="submit" id="save-btn" class="btn btn-primary btn-full"> Save and Start Swiping </button>

      </form>
    </div>

  </div>

  <script type="module" src="/static/app.js"></script>
  <script type="module" src="/static/profile-setup.js"></script>
</body>
</html>
