{% extends "base.html" %}
{% block content %}
  <h1>Login</h1>

  <form method="post" action="/login">
    <label>Email</label><br>
    <input name="email" type="email" required><br><br>

    <label>Password</label><br>
    <input name="password" type="password" required><br><br>

    <button type="submit">Login</button>
  </form>
{% endblock %}
